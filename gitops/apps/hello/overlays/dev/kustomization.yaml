apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hello
resources:
  - ../../base
replicas:
  - name: hello
    count: 1
patches:
  - target:
      kind: Deployment
      name: hello
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: dev
  - target:
      kind: Ingress
      name: hello
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: hello.dev.example.com
